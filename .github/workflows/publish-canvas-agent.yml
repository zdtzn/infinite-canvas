name: Publish Canvas Agent

on:
  workflow_run:
    workflows: ["Docker image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-canvas-agent
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canvas-agent
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Agent release
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Use a stable Agent package version" >&2; exit 1; }
          tag="canvas-agent-v$version"
          asset="zdtzn-canvas-agent-$version.tgz"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.package.outputs.exists != 'true'
        run: npm ci --no-audit --no-fund

      - name: Verify Agent
        if: steps.package.outputs.exists != 'true'
        run: |
          npm test
          npx tsc --noEmit -p tsconfig.json

      - name: Pack Agent
        if: steps.package.outputs.exists != 'true'
        env:
          RELEASE_ASSET: ${{ steps.package.outputs.asset }}
        run: |
          npm pack --json > "$RUNNER_TEMP/canvas-agent-pack.json"
          packed=$(node -p "require(process.env.RUNNER_TEMP + '/canvas-agent-pack.json')[0].filename")
          if [ "$packed" != "$RELEASE_ASSET" ]; then mv "$packed" "$RELEASE_ASSET"; fi
          sha256sum "$RELEASE_ASSET" > "$RELEASE_ASSET.sha256"
          tar -tzf "$RELEASE_ASSET" | grep -Fx 'package/dist/index.js'

      - name: Publish standalone Agent
        if: steps.package.outputs.exists != 'true'
        env:
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_ASSET: ${{ steps.package.outputs.asset }}
        run: |
          cat > "$RUNNER_TEMP/canvas-agent-release.md" <<EOF
          本仓库的独立 Canvas Agent 客户端，通过 GitHub 安装包分发；没有发布到 npm。

          启动：
          \`\`\`sh
          npx -y --package=https://github.com/zdtzn/infinite-canvas/releases/download/$RELEASE_TAG/$RELEASE_ASSET canvas-agent
          \`\`\`

          MCP 模式在命令末尾加 \`mcp\`，调试模式加 \`--debug\`。升级时先停止旧进程再运行新命令；首次连接请填写启动终端里的 Connect token。
          EOF
          gh release create "$RELEASE_TAG" "$RELEASE_ASSET" "$RELEASE_ASSET.sha256" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --title "Canvas Agent ${RELEASE_TAG#canvas-agent-v}" --notes-file "$RUNNER_TEMP/canvas-agent-release.md" --latest=false
